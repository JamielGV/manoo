name = "manoo-payments"
main = "src/index.mjs"
compatibility_date = "2026-01-01"

# Created by: wrangler kv namespace create PROCESSED_PAYMENTS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "PROCESSED_PAYMENTS"
id = "9ab89ab46a5245a8adc257f81df2a4dc"

# Secrets (set with `wrangler secret put <NAME>` — never put real values here):
#   STRIPE_SECRET_KEY      — Stripe secret key (sk_live_...)
#   STRIPE_WEBHOOK_SECRET  — Stripe webhook signing secret (whsec_...)
#   MANOO_PRIVATE_KEY_PEM  — the Ed25519 private key from licensing/private-key.pem
#   RESEND_API_KEY         — Resend API key for sending the license email
#   SELLER_NOTIFY_EMAIL    — Jamiel's email, gets a copy of every sale
#
# No EXPECTED_AMOUNT_CENTS secret anymore — src/index.mjs hardcodes both
# known prices (4900 = $49.00/year, 600 = $6.00/month) and the license
# length each one grants, so it accepts either and rejects anything else.
# Update LICENSE_DAYS_BY_AMOUNT there (not here) if the price ever changes.
